<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101719">
<title>Meu Relógio</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#101719;color:#f0faf6}
*{box-sizing:border-box}body{margin:0}main{max-width:38rem;margin:auto;padding:clamp(1.25rem,6vw,3rem)}
h1{font-size:clamp(2.25rem,9vw,3.5rem);letter-spacing:-.045em;margin:1.5rem 0 .4rem}
h2{font-size:1.15rem;margin:0 0 .75rem}p{line-height:1.55;color:#b7c9c4}
header p{margin:0 0 2rem}section{background:#192426;border:1px solid #354745;border-radius:1.25rem;padding:1.25rem;margin:1rem 0}
button{border:1px solid #526a65;border-radius:.65rem;background:#243632;color:#f0faf6;font:inherit;font-weight:650;min-height:46px;padding:.65rem 1rem;cursor:pointer}
.primary{background:#a3e9cd;color:#10251e;border-color:transparent}button:disabled{opacity:.46;cursor:default}
.actions{display:flex;gap:.6rem;flex-wrap:wrap}output,li{overflow-wrap:anywhere}output{display:block;margin-top:1rem;color:#b7c9c4}ul{padding-left:1.25rem}li{margin:.55rem 0}a{color:#a3e9cd}
</style>
<main>
<header><h1>Meu Relógio</h1><p>Conecte seu relógio e consulte o que ele disponibiliza por Bluetooth.</p></header>
<section aria-labelledby="connection">
<h2 id="connection">Conexão</h2>
<p id="status" role="status">Pronto para buscar o relógio.</p>
<div class="actions">
<button class="primary" id="connect">Buscar e conectar</button>
<button id="disconnect" disabled>Desconectar</button>
</div>
<p id="help" hidden>No iPhone, abra esta mesma página no <a href="https://apps.apple.com/br/app/bluefy-web-ble-browser/id1492822055">Bluefy</a>.</p>
</section>
<section aria-labelledby="reading">
<h2 id="reading">Leitura Bluetooth</h2>
<button id="read" disabled>Ler valor</button>
<output id="result" aria-live="polite">Conecte o relógio para ler.</output>
<details id="details" hidden><summary>Serviços encontrados</summary><ul id="services"></ul></details>
</section>
</main>
<script>
const serviceId = 'cc353442-be58-4ea2-876e-11d8d6976366';
const valueId = 'c551c36a-0377-4a29-9657-74ffb655a188';
const otherServices = ['000001ff-3c17-d293-8e48-14fe2e4da212', 0xae00];
const byId = id => document.getElementById(id);
const connect = byId('connect');
const disconnect = byId('disconnect');
const read = byId('read');
const status = byId('status');
const result = byId('result');
const details = byId('details');
let device;
let characteristic;
let operation = 0;

function reset(message) {
  operation++;
  if (device?.gatt?.connected) device.gatt.disconnect();
  device?.removeEventListener('gattserverdisconnected', onDisconnect);
  device = undefined;
  characteristic = undefined;
  connect.disabled = false;
  disconnect.disabled = true;
  read.disabled = true;
  details.hidden = true;
  status.textContent = message;
  result.textContent = 'Conecte o relógio para ler.';
}

function onDisconnect() {
  reset('Relógio desconectado.');
}

connect.addEventListener('click', async () => {
  const current = ++operation;
  connect.disabled = true;
  status.textContent = 'Selecione Apple Watch Ultra 1 Bor na lista.';
  try {
    device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [serviceId, ...otherServices],
    });
    device.addEventListener('gattserverdisconnected', onDisconnect);
    status.textContent = 'Conectando…';
    const server = await device.gatt.connect();
    if (current !== operation) return;
    status.textContent = 'Conectado a ' + (device.name || 'relógio');
    disconnect.disabled = false;
    result.textContent = 'Buscando serviço de leitura…';

    const service = await server.getPrimaryService(serviceId);
    const value = await service.getCharacteristic(valueId);
    if (current !== operation) return;
    characteristic = value;
    read.disabled = false;
    result.textContent = 'Pronto para ler.';
    try {
      const services = await server.getPrimaryServices();
      if (current !== operation) return;
      byId('services').replaceChildren(...services.map(service => {
        const item = document.createElement('li');
        item.textContent = service.uuid;
        return item;
      }));
      details.hidden = services.length === 0;
    } catch {
      // A listagem é opcional quando a leitura direta está disponível.
    }
  } catch (error) {
    if (current !== operation) return;
    if (device?.gatt?.connected) {
      result.textContent = 'Serviço de leitura indisponível. ' + error.message;
      return;
    }
    reset(error.name === 'NotFoundError' ? 'Seleção cancelada ou relógio indisponível.' :
      'Falha na conexão. ' + error.message);
  }
});

disconnect.addEventListener('click', onDisconnect);

read.addEventListener('click', async () => {
  const current = operation;
  read.disabled = true;
  result.textContent = 'Lendo…';
  try {
    const value = await characteristic.readValue();
    if (current !== operation) return;
    const bytes = new Uint8Array(value.buffer, value.byteOffset, value.byteLength);
    result.textContent = bytes.length
      ? Array.from(bytes, byte => byte.toString(16).padStart(2, '0').toUpperCase()).join(' ')
      : 'O relógio respondeu com um valor vazio.';
  } catch (error) {
    if (current === operation) result.textContent = 'Falha na leitura. ' + error.message;
  } finally {
    if (current === operation) read.disabled = false;
  }
});

if (!window.isSecureContext || !navigator.bluetooth?.requestDevice) {
  connect.disabled = true;
  status.textContent = 'Abra a página por HTTPS em um navegador com Web Bluetooth.';
  byId('help').hidden = false;
}
</script>
</html>
